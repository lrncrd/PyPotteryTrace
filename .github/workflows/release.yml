name: Auto Release

# Every push to main gets a new patch release automatically (e.g. v0.1.0 -> v0.1.1),
# so the PyPottery Suite launcher can detect and download the update. No manual
# tagging or release step needed.

"on":
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          # Only consider real semver tags (vX.Y.Z) - ignores legacy/non-numeric
          # tags (e.g. "prerelease") that the launcher can't compare reliably.
          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)

          if [ -z "$latest_tag" ]; then
            new_tag="v0.1.0"
          else
            version="${latest_tag#v}"
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi

          echo "Previous tag: ${latest_tag:-none}"
          echo "New tag: $new_tag"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
